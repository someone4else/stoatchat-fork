name: Docker Test & Publish

on:
  push:
    tags:
      - "*"
    branches:
      - main
      - "feat/**"
  pull_request:
    paths:
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  base:
    name: Test base image build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # Configure build environment
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build the image
      - name: Build base image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/base:latest
          cache-from: type=gha,scope=buildx-base
          cache-to: type=gha,scope=buildx-base,mode=max

  publish:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    name: Publish Docker images
    steps:
      # Configure build environment
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Authenticate with GHCR
      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the base image
      - name: Build base image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/base:${{ github.sha }}
          cache-from: type=gha,scope=buildx-base
          cache-to: type=gha,scope=buildx-base,mode=max

      # api
      - name: Publish API
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: crates/delta/Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/api:${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/base:${{ github.sha }}

      # events
      - name: Publish Events
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: crates/bonfire/Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/events:${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/base:${{ github.sha }}

      # file-server
      - name: Publish File Server
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: crates/services/autumn/Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/file-server:${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/base:${{ github.sha }}

      # proxy
      - name: Publish Proxy
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: crates/services/january/Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/proxy:${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/base:${{ github.sha }}

      # gifbox
      - name: Publish Gifbox
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: crates/services/gifbox/Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/gifbox:${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/base:${{ github.sha }}

      # crond
      - name: Publish Crond
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: crates/daemons/crond/Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/crond:${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/base:${{ github.sha }}

      # pushd
      - name: Publish Pushd
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: crates/daemons/pushd/Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/pushd:${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/base:${{ github.sha }}

      # voice-ingress
      - name: Publish Voice Ingress
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: crates/daemons/voice-ingress/Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/voice-ingress:${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/base:${{ github.sha }}
